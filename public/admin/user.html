<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Admin - Utilisateurs</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 6px;
      }
      th {
        background: #eee;
      }
    </style>
  </head>
  <body>
    <h1>Ajouter un utilisateur</h1>
    <form id="userForm">
      <input name="firstname" placeholder="Prénom" required />
      <input name="lastname" placeholder="Nom" required />
      <input name="phone" placeholder="Téléphone (optionnel)" />
      <button type="submit">Ajouter</button>
    </form>

    <h2>Utilisateurs existants</h2>
    <table id="usersTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Prénom</th>
          <th>Nom</th>
          <th>Téléphone</th>
          <th>Équipe</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <!-- Les utilisateurs seront insérés ici -->
      </tbody>
    </table>

    <script>
      let teams = [];

      async function fetchTeams() {
        const res = await fetch("/api/teams");
        teams = await res.json();
      }
      async function fetchUsers() {
        const res = await fetch("/api/users");
        const users = await res.json();
        const tbody = document
          .getElementById("usersTable")
          .querySelector("tbody");
        tbody.innerHTML = "";
        users.forEach((user) => {
          console.log("user.team_id = ", user.team_id, typeof user.team_id);
          console.log("teams = ", teams);

          tbody.innerHTML += `<tr data-user-id="${user.id}">
          <td>${user.id}</td>
          <td>${user.first_name}</td>
          <td>${user.last_name}</td>
          <td>${user.phone || ""}</td>
          <td>
            <select onchange="changeTeam(${user.id}, this.value)">
              <option value="" ${
                user.team_id == null ? "selected" : ""
              }>(Aucune)</option>

              ${teams

                .map(
                  (t) => `
                  <option value="${t.id}" ${
                    Number(user.team_id) === Number(t.id) ? "selected" : ""
                  }>${t.name}</option>
                `
                )
                .join("")}
            </select>
          </td>
          <td>
            <button onclick="deleteUser(${user.id})">Supprimer</button>
            <button onclick="editUser(${user.id})">Modifier</button>
          </td>
        </tr>`;
        });
      }

      window.changeTeam = async function (userId, teamId) {
        // teamId est une string (ex: "2" ou "" si aucune)
        const value = teamId === "" ? null : Number(teamId);
        await fetch(`/api/users/${userId}/team`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ teamId: value }),
        });
        fetchUsers();
      };

      window.deleteUser = async function (userId) {
        if (!confirm("Supprimer cet utilisateur ?")) return;
        await fetch(`/api/users/${userId}`, { method: "DELETE" });
        fetchUsers();
      };

      window.editUser = async function (userId) {
        const row = document.querySelector(`tr[data-user-id="${userId}"]`);

        const currentFirst = row.children[1].innerText;
        const currentLast = row.children[2].innerText;
        const currentPhone = row.children[3].innerText;

        const firstname = prompt("Modifier le prénom :", currentFirst);
        if (firstname === null) return;
        const lastname = prompt("Modifier le nom :", currentLast);
        if (lastname === null) return;
        const phone = prompt(
          "Modifier le téléphone (laisser vide si inchangé) :",
          currentPhone
        );

        const res = await fetch(`/api/users/${userId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ firstname, lastname, phone }),
        });

        const json = await res.json();
        alert(json.message);
        fetchUsers();
      };

      document.getElementById("userForm").onsubmit = async function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(this));
        const res = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        alert((await res.json()).message);
        this.reset();
        fetchUsers();
      };

      async function init() {
        await fetchTeams();
        fetchUsers();
        console.log("Reçu pour update team :", teamId, typeof teamId);
      }
      init();
    </script>
  </body>
</html>
