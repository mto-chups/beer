<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Admin - Dark 🏴󠁢󠁳󠁢󠁰󠁿</title>
    <style>
      /* --- PALETTE (facile à modifier) ---------------------------------------- */
      :root {
        --bg-dark: #333;
        --bg-dark-soft: #575757;
        --bg-light: #f7f7f7;
        --txt-light: antiquewhite;
        --txt-muted: #b6b6b6;
        --accent: rgb(197, 161, 0);
        --accent-dark: rgba(197, 161, 0, 0.8);
      }
      /* ----------------------------------------------------------------------- */

      body {
        font-family: sans-serif;
        background: var(--bg-dark);
        color: var(--txt-light);
        margin: 0;
        padding: 0;
      }

      h1,
      h2 {
        color: #fff;
        margin: 0;
      }

      /* --- ACCORDÉON --------------------------------------------------------- */
      .accordion {
        margin: 30px auto;
        max-width: 75%;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 16px #0006;
        background: var(--bg-dark-soft);
      }
      .tab {
        border-bottom: 1px solid #444;
      }
      .tab > input {
        display: none;
      }

      .tab-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        padding: 18px 32px;
        background: var(--bg-dark-soft);
        font-size: 1.15em;
        font-weight: bold;
        transition: background 0.2s;
      }
      .tab-label:hover {
        background: #4c4c4c;
      }

      .tab-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.28s cubic-bezier(0, 1, 0, 1);
        padding: 0 32px;
        background: var(--bg-dark);
      }
      .tab input:checked ~ .tab-content {
        max-height: 1600px;
        padding-bottom: 28px;
        transition: max-height 0.42s cubic-bezier(1, 0, 1, 0);
      }

      /* --- TABLES ------------------------------------------------------------ */
      table {
        width: 100%;
        margin-top: 18px;
        border-collapse: collapse;
        background: var(--bg-dark-soft);
        border-radius: 4px;
      }
      th,
      td {
        padding: 6px;
        border: 1px solid #666;
      }
      th {
        background: #444;
        color: #eee;
      }
      tr.inactive {
        color: var(--txt-muted);
      }

      /* --- FORMES & CHAMPS --------------------------------------------------- */
      form {
        margin-top: 18px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      form input,
      form select {
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid #666;
        background: var(--bg-dark);
        color: var(--txt-light);
      }
      form button {
        padding: 7px 14px;
        border-radius: 5px;
        border: none;
        font-weight: bold;
        background: var(--accent);
        color: #222;
        cursor: pointer;
      }
      form button:hover {
        background: var(--accent-dark);
        color: #fff;
      }

      /* --- BOUTONS “Actions” dans les tables -------------------------------- */
      .actions button {
        margin-right: 7px;
        padding: 3px 8px;
        border: none;
        border-radius: 4px;
        background: var(--bg-dark);
        color: var(--txt-light);
        cursor: pointer;
      }
      .actions button:hover {
        background: var(--accent-dark);
        color: #fff;
      }

      /* --- iOS-LIKE SWITCH déjà présent ------------------------------------- */
      #activeOnly {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 28px;
        vertical-align: middle;
      }
      .switch::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: rgba(197, 161, 0, 0.5);
        border-radius: 14px;
        transition: background-color 0.3s;
      }
      .switch::after {
        content: "";
        position: absolute;
        width: 24px;
        height: 24px;
        top: 2px;
        left: 2px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 3px #0004;
        transition: transform 0.3s;
      }
      #activeOnly:checked + .switch::before {
        background: var(--accent);
      }
      #activeOnly:checked + .switch::after {
        transform: translateX(22px);
      }
      .switch-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        padding: 10px;
        margin: 10px;
        user-select: none;
      }

      /* --- FLASH MESSAGES --------------------------------------------------- */
      .message {
        margin-top: 1rem;
        padding: 0.8rem;
        border-radius: 4px;
      }
      .message.success {
        background: #2d7a4b;
        color: #e0f7e9;
      }
      .message.error {
        background: #8a2c2c;
        color: #fdecea;
      }
    </style>
  </head>
  <body>
    <div class="accordion">
      <!-- Onglet Utilisateurs -->
      <div class="tab">
        <input type="checkbox" id="tab-users" checked />
        <label class="tab-label" for="tab-users">🙋‍♂️ Utilisateurs</label>
        <div class="tab-content" id="usersSection">
          <form id="userForm">
            <input name="firstname" placeholder="Prénom" required />
            <input name="lastname" placeholder="Nom" required />
            <input name="phone" placeholder="Téléphone (optionnel)" />
            <!-- Nouveaux champs -->
            <input
              name="weight"
              type="number"
              step="0.1"
              placeholder="Poids (kg)"
              required
            />
            <input name="age" type="number" placeholder="Âge" required />
            <select name="gender" required>
              <option value="M">H</option>
              <option value="F">F</option>
            </select>
            <button type="submit">Ajouter</button>
          </form>

          <table id="usersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Téléphone</th>
                <th>Poids</th>
                <th>Âge</th>
                <th>Sexe</th>
                <th>Équipe</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Onglet Bières -->
      <div class="tab">
        <input type="checkbox" id="tab-beers" />
        <label class="tab-label" for="tab-beers">🍺 Bières</label>
        <div class="tab-content" id="beersSection">
          <form id="beerForm">
            <input type="text" name="brand" placeholder="Marque" required />
            <input
              type="text"
              name="type"
              placeholder="Type (blonde, brune...)"
              required
            />
            <input
              type="number"
              name="volume_ml"
              placeholder="Quantité (ml)"
              step="0.01"
              required
            />
            <input
              type="number"
              name="alcohol_degree"
              placeholder="Degré (%)"
              step="0.01"
              required
            />
            <button type="submit">Ajouter</button>
          </form>
          <table id="beersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Marque</th>
                <th>Type</th>
                <th>Quantité (ml)</th>
                <th>Degré (%)</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Onglet Équipes -->
      <div class="tab">
        <input type="checkbox" id="tab-teams" />
        <label class="tab-label" for="tab-teams">🧑‍🤝‍🧑 Équipes</label>
        <div class="tab-content" id="teamsSection">
          <form id="teamForm">
            <input name="name" placeholder="Nom de l'équipe" required />
            <button type="submit">Créer équipe</button>
          </form>
          <table id="teamsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- BONUS MANUEL  -->
      <div class="tab">
        <input type="checkbox" id="tab-bonus" />
        <label class="tab-label" for="tab-bonus">➕ Bonus manuel</label>
        <div class="tab-content">
          <h3>Ajouter un bonus manuel</h3>
          <div id="flash-container-bonus"></div>
          <form id="bonusForm">
            <label>
              Équipe
              <select name="teamId" id="bonusTeamSelect" required>
                <option value="">Chargement…</option>
              </select>
            </label>
            <label>
              Points (+ ou −)
              <input type="number" name="points" required />
            </label>
            <label>
              Commentaire (optionnel)
              <textarea name="reason" rows="2"></textarea>
            </label>
            <button type="submit">Enregistrer le bonus</button>
          </form>
        </div>
      </div>

      <!-- ADD RFID -->
      <div class="tab">
        <input type="checkbox" id="tab-rfid" />
        <label class="tab-label" for="tab-rfid">Add RFID</label>
        <div
          class="tab-content"
          id="rfidSection"
          style="padding: 0 32px; text-align: center"
        >
          <h3>Penser à lancer le programme python rec_rfid.py</h3>
          <a href="http://localhost:3000/admin/rfid-add.html"
            >Associer une bière à un RFID</a
          >
        </div>
      </div>
    </div>

    <script>
      async function fetchJSON(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`Fetch ${url} → ${r.status}`);
        return r.json();
      }
      let teams = [];

      // --- USERS ---
      async function fetchUsers() {
        const users = await fetchJSON("/api/users");
        const tbody = document.querySelector("#usersTable tbody");
        tbody.innerHTML = "";

        users.forEach((user) => {
          // on force weight en nombre
          const weight = parseFloat(user.weight) || 0;
          tbody.innerHTML += `
        <tr data-user-id="${user.id}">
          <td>${user.id}</td>
          <td>${user.firstname}</td>
          <td>${user.lastname}</td>
          <td>${user.phone || ""}</td>
          <td>${weight.toFixed(1)} kg</td>
          <td>${user.age}</td>
          <td>${user.gender}</td>
          <td>
            <select onchange="changeTeam(${user.id}, this.value)">
              <option value="" ${
                user.team_id == null ? "selected" : ""
              }>(Aucune)</option>
              ${teams
                .map(
                  (t) => `
                <option value="${t.id}" ${
                    user.team_id === t.id ? "selected" : ""
                  }>
                  ${t.name}
                </option>
              `
                )
                .join("")}
            </select>
          </td>
          <td class="actions">
            <button onclick="deleteUser(${user.id})">Supprimer</button>
            <button onclick="editUser(${user.id})">Modifier</button>
          </td>
        </tr>
      `;
        });
      }

      // --- BONUS MANUEL ---
      // affiche message dans l'onglet bonus
      function flashBonus(msg, type = "success") {
        const c = document.getElementById("flash-container-bonus");
        const d = document.createElement("div");
        d.className = `flash ${type}`;
        d.textContent = msg;
        c.append(d);
        setTimeout(() => d.remove(), 4000);
      }

      // charge les équipes dans le <select> bonus
      async function loadTeamsForBonus() {
        const sel = document.getElementById("bonusTeamSelect");
        sel.innerHTML = '<option value="">-- Choisir une équipe --</option>';
        try {
          // 1) Charge toutes les équipes
          const teams = await fetchJSON("/api/teams");
          // 2) Charge tous les utilisateurs
          const allUsers = await fetchJSON("/api/users");
          // 3) Pour chaque équipe, filtre ses membres et construis l’option
          teams.forEach((t) => {
            const members = allUsers
              .filter((u) => u.team_id === t.id)
              .map((u) => u.firstname)
              .join(", ");
            const opt = document.createElement("option");
            opt.value = t.id;
            opt.textContent = t.name + (members ? ` (${members})` : "");
            sel.appendChild(opt);
          });
        } catch (e) {
          console.error(e);
          const container = document.getElementById("flash-container-bonus");
          const d = document.createElement("div");
          d.className = "flash error";
          d.textContent = "Erreur chargement équipes";
          container.append(d);
          setTimeout(() => d.remove(), 4000);
        }
      }

      // gère la soumission du bonus
      document.getElementById("bonusForm").onsubmit = async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        let r;
        try {
          r = await fetch("/api/manual_bonus", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
        } catch (err) {
          console.error(err);
          return flashBonus("Erreur réseau", "error");
        }
        if (!r.ok) {
          const txt = await r.text();
          console.error("API error", r.status, txt);
          return flashBonus(`Erreur ${r.status}`, "error");
        }
        const json = await r.json();
        flashBonus(json.message, "success");
        e.target.reset();
      };

      // --- TEAMS ---
      async function fetchTeams() {
        const res = await fetch("/api/teams");
        teams = await res.json();
        // Remplis le tableau équipes
        const tbody = document.querySelector("#teamsTable tbody");
        tbody.innerHTML = "";
        teams.forEach((team) => {
          tbody.innerHTML += `<tr data-team-id="${team.id}">
            <td>${team.id}</td>
            <td>${team.name}</td>
            <td class="actions">
            <button onclick="editTeam(${team.id})">Modifier</button>
            <button onclick="deleteTeam(${team.id})">Supprimer</button>
            </td>
        </tr>`;
        });
      }
      document.getElementById("teamForm").onsubmit = async function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(this));
        const res = await fetch("/api/teams", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        alert((await res.json()).message);
        this.reset();
        fetchTeams();
        fetchUsers();
      };

      window.deleteTeam = async function (teamId) {
        if (!confirm("Supprimer cette équipe ?")) return;
        const res = await fetch(`/api/teams/${teamId}`, { method: "DELETE" });
        const json = await res.json();
        alert(json.message);
        fetchTeams();
        fetchUsers(); // pour mettre à jour le select équipe côté users
      };

      window.editTeam = async function (teamId) {
        const row = document.querySelector(`tr[data-team-id="${teamId}"]`);
        const currentName = row.children[1].innerText;
        const name = prompt("Nouveau nom d'équipe :", currentName);
        if (!name) return;
        const res = await fetch(`/api/teams/${teamId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        });
        const json = await res.json();
        alert(json.message);
        fetchTeams();
        fetchUsers();
      };

      window.changeTeam = async function (userId, teamId) {
        const value = teamId === "" ? null : Number(teamId);
        await fetch(`/api/users/${userId}/team`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ teamId: value }),
        });
        fetchUsers();
        loadTeamsForBonus();
      };
      window.deleteUser = async function (userId) {
        if (!confirm("Supprimer cet utilisateur ?")) return;
        await fetch(`/api/users/${userId}`, { method: "DELETE" });
        fetchUsers();
      };
      window.editUser = async function (userId) {
        const row = document.querySelector(`tr[data-user-id="${userId}"]`);
        const current = {
          firstname: row.children[1].innerText,
          lastname: row.children[2].innerText,
          phone: row.children[3].innerText,
          weight: parseFloat(row.children[4].innerText),
          age: parseInt(row.children[5].innerText, 10),
          gender: row.children[6].innerText,
        };

        const firstname = prompt("Prénom :", current.firstname);
        if (firstname === null) return;
        const lastname = prompt("Nom :", current.lastname);
        if (lastname === null) return;
        const phone = prompt("Téléphone :", current.phone);
        const weight = prompt("Poids (kg) :", current.weight);
        if (weight === null || isNaN(parseFloat(weight)))
          return alert("Poids invalide");
        const age = prompt("Âge :", current.age);
        if (age === null || isNaN(parseInt(age, 10)))
          return alert("Âge invalide");
        const gender = prompt("Sexe (male/female/other) :", current.gender);
        if (gender === null) return;

        const res = await fetch(`/api/users/${userId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            firstname,
            lastname,
            phone,
            weight: parseFloat(weight),
            age: parseInt(age, 10),
            gender,
          }),
        });
        const json = await res.json();
        alert(json.message);
        fetchUsers();
      };

      // form submission : envoyez aussi weight, age, gender
      document.getElementById("userForm").onsubmit = async function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(this));
        const res = await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        alert((await res.json()).message);
        this.reset();
        fetchUsers();
      };

      // --- BEERS ---
      async function fetchBeers() {
        const res = await fetch("/api/beers");
        const beers = await res.json();
        const tbody = document.querySelector("#beersTable tbody");
        tbody.innerHTML = "";
        beers.forEach((beer) => {
          tbody.innerHTML += `<tr data-beer-id="${beer.id}">
          <td>${beer.id}</td>
          <td>${beer.brand}</td>
          <td>${beer.type}</td>
          <td>${Number(beer.volume_ml).toFixed(2)}</td>
          <td>${Number(beer.alcohol_degree).toFixed(2)}</td>
          <td class="actions">
            <button onclick="editBeer(${beer.id})">Modifier</button>
            <button onclick="deleteBeer(${beer.id})">Supprimer</button>
          </td>
        </tr>`;
        });
      }
      window.deleteBeer = async function (id) {
        if (!confirm("Supprimer cette bière ?")) return;
        await fetch(`/api/beers/${id}`, { method: "DELETE" });
        fetchBeers();
      };
      window.editBeer = async function (id) {
        const row = document.querySelector(`tr[data-beer-id='${id}']`);
        const brand = prompt("Nouvelle marque :", row.children[1].innerText);
        if (brand === null) return;
        const type = prompt("Nouveau type :", row.children[2].innerText);
        if (type === null) return;
        const volume_ml =
          Math.round(
            parseFloat(
              prompt("Nouvelle quantité (ml) :", row.children[3].innerText)
            ) * 100
          ) / 100;
        if (isNaN(volume_ml)) return alert("Valeur non valide !");
        const alcohol_degree =
          Math.round(
            parseFloat(
              prompt("Nouveau degré d'alcool (%) :", row.children[4].innerText)
            ) * 100
          ) / 100;
        if (isNaN(alcohol_degree)) return alert("Valeur non valide !");
        const res = await fetch(`/api/beers/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ brand, type, volume_ml, alcohol_degree }),
        });
        const json = await res.json();
        alert(json.message);
        fetchBeers();
      };
      document.getElementById("beerForm").onsubmit = async function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(this));
        const res = await fetch("/api/beers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        alert((await res.json()).message);
        this.reset();
        fetchBeers();
      };

      // Initialisation globale
      async function initAll() {
        await fetchTeams();
        await fetchUsers();
        await fetchBeers();
        await loadTeamsForBonus();
      }
      initAll();
    </script>
  </body>
</html>
