<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dépose ta bière</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; max-width: 560px; margin: 0 auto; padding: 2rem 1.25rem;
        overflow-x: hidden; font-family: Arial, sans-serif; text-align: center;
        color: antiquewhite; background: rgb(51, 51, 51); rotate: 180deg;
              /* rotate: 180deg; */

      }
      h1, h2 { margin: 0 0 1rem; letter-spacing: 0; }
      h2 { font-size: 1.35rem; }
      .grid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: .8rem; margin-bottom: 1.5rem;
      }
      .card {
        min-height: 58px; padding: .8rem; border: 2px solid transparent; border-radius: 8px;
        color: rgba(250, 235, 215, .9); background: rgb(81, 81, 81);
        box-shadow: 0 2px 6px rgba(0, 0, 0, .2); cursor: pointer; font: inherit;
        transition: transform .15s, box-shadow .15s, border-color .15s; user-select: none;
      }
      .card:hover, .card:focus-visible {
        outline: none; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0, 0, 0, .25);
      }
      .card.selected { border-color: rgb(225, 184, 0); }
      .card-detail { display: block; margin-top: .35rem; color: rgba(250, 235, 215, .65); font-size: .82rem; }
      .message { margin: 0 0 1.5rem; color: #d8d8d8; }
      #popupOverlay {
        position: fixed; inset: 0; z-index: 1000; display: none; align-items: center;
        justify-content: center; padding: 1rem; background: rgba(0, 0, 0, .78);
      }
      #popup {
        width: min(340px, 100%); padding: 2rem; border-radius: 8px;
        color: #1f1f1f; background: #fff; text-align: center;
      }
      #popup h3 { margin: 0 0 .75rem; font-size: 1.55rem; }
      #depositBeer { margin: 0; font-weight: 700; }
      #depositStatus { min-height: 1.5rem; margin: .75rem 0; color: #555; }
      #countdown { margin: .5rem 0 1.25rem; color: rgb(150, 122, 0); font-size: 4rem; font-weight: 800; line-height: 1; }
      #popup .close-btn {
        padding: .55rem 1.25rem; border: 1px solid #333; border-radius: 6px;
        color: #222; background: transparent; cursor: pointer; font-size: 1rem;
      }
      #gifContainer { margin-top: 1rem; text-align: center; }
      #gifContainer img { display: inline-block; max-width: 200px; }
      .last-score { min-height: 5rem; margin: .8rem 0 0; color: #d0d0d0; font-size: 3.5rem; font-weight: 800; }
      #beerRain {
        position: fixed; inset: 0; z-index: 1100; overflow: hidden; pointer-events: none;
      }
      .beer-drop {
        position: absolute; top: -40px; pointer-events: none;
        font-size: 2rem; animation: drop-beer linear forwards;
      }
      @keyframes drop-beer {
        from { transform: translateY(0) rotate(0deg); opacity: 1; }
        to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
      }
      @keyframes bg-success {
        0%, 100% { background-color: rgb(51, 51, 51); }
        50% { background-color: rgba(19, 180, 19, .6); }
      }
      @keyframes bg-failure {
        0%, 100% { background-color: rgb(51, 51, 51); }
        50% { background-color: rgba(192, 23, 23, .6); }
      }
      @keyframes score-pop {
        0% { transform: scale(0); opacity: 0; }
        50% { transform: scale(1.35); color: gold; opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .flash-success { animation: bg-success 2s ease-in; }
      .flash-failure { animation: bg-failure 1.5s ease-in; }
      .score-pop { animation: score-pop 1s ease-out; }
    </style>
  </head>
  <body>
    <h1>Choisissez votre équipe</h1>
    <div id="teamsGrid" class="grid"></div>

    <section id="usersSection" hidden>
      <h2>Choisissez votre nom</h2>
      <div id="usersGrid" class="grid"></div>
    </section>
    <section id="typesSection" hidden>
      <h2>Choisissez le type de bière</h2>
      <div id="typesGrid" class="grid"></div>
    </section>
    <section id="brandsSection" hidden>
      <h2>Choisissez la marque</h2>
      <div id="brandsGrid" class="grid"></div>
    </section>

    <p id="pageMessage" class="message" aria-live="polite"></p>
    <p id="lastScore" class="last-score" aria-live="polite"></p>
    <div id="gifContainer"></div>
    <div id="beerRain" aria-hidden="true"></div>

    <div id="popupOverlay" role="dialog" aria-modal="true" aria-labelledby="depositTitle">
      <div id="popup">
        <h3 id="depositTitle">Dépose ta bière</h3>
        <p id="depositBeer"></p>
        <p id="depositStatus">Ouverture du moteur 1...</p>
        <p id="countdown">15</p>
        <button class="close-btn" type="button">Annuler</button>
      </div>
    </div>

    <script>
      const KIOSK_SESSION_URL = "/api/kiosk-session/current";
      const CONSUME_SELECTED_URL = "/api/beerbu/consume-selected";
      const DEPOSIT_DURATION_SECONDS = 15;
      const $ = (id) => document.getElementById(id);
      const teamsGrid = $("teamsGrid");
      const usersSection = $("usersSection");
      const usersGrid = $("usersGrid");
      const typesSection = $("typesSection");
      const typesGrid = $("typesGrid");
      const brandsSection = $("brandsSection");
      const brandsGrid = $("brandsGrid");
      const pageMessage = $("pageMessage");
      const lastScore = $("lastScore");
      const gifContainer = $("gifContainer");
      const beerRainContainer = $("beerRain");
      const popupOverlay = $("popupOverlay");
      const popupClose = popupOverlay.querySelector(".close-btn");
      const depositBeer = $("depositBeer");
      const depositStatus = $("depositStatus");
      const countdown = $("countdown");

      let beers = [];
      let selectedTeamId = null;
      let selectedUserId = null;
      let selectedType = null;
      let selectedBeer = null;
      let depositActive = false;
      let depositTimer = null;
      let countdownTimer = null;

      function escapeHtml(value) {
        const element = document.createElement("div");
        element.textContent = String(value ?? "");
        return element.innerHTML;
      }

      async function fetchJSON(url, options = {}) {
        const response = await fetch(url, options);
        if (!response.ok) {
          let message = response.statusText;
          try {
            const payload = await response.json();
            message = payload.message || message;
          } catch (_) {}
          throw new Error(message);
        }
        return response.status === 204 ? null : response.json();
      }

      function selectCard(grid, selectedCard) {
        grid.querySelectorAll(".card").forEach((card) => card.classList.remove("selected"));
        selectedCard.classList.add("selected");
      }

      function clearDepositTimers() {
        clearTimeout(depositTimer);
        clearInterval(countdownTimer);
        depositTimer = null;
        countdownTimer = null;
      }

      function resetSelection() {
        selectedTeamId = null;
        selectedUserId = null;
        selectedType = null;
        selectedBeer = null;
        usersSection.hidden = true;
        typesSection.hidden = true;
        brandsSection.hidden = true;
        usersGrid.innerHTML = "";
        typesGrid.innerHTML = "";
        brandsGrid.innerHTML = "";
        teamsGrid.querySelectorAll(".card").forEach((card) => card.classList.remove("selected"));
      }

      function flash(className) {
        document.body.classList.remove(className);
        void document.body.offsetWidth;
        document.body.classList.add(className);
        document.body.addEventListener("animationend", () => document.body.classList.remove(className), { once: true });
      }

      function spawnBeer() {
        const beer = document.createElement("div");
        beer.className = "beer-drop";
        beer.textContent = "🍺";
        const centeredPosition = 20 + ((Math.random() + Math.random()) / 2) * 60;
        beer.style.left = `${centeredPosition}%`;
        beer.style.animationDuration = `${Math.random() * 3 + 3}s`;
        beerRainContainer.appendChild(beer);
        beer.addEventListener("animationend", () => beer.remove());
      }

      function showSuccess(score) {
        flash("flash-success");
        lastScore.textContent = `+${score} points`;
        lastScore.classList.remove("score-pop");
        void lastScore.offsetWidth;
        lastScore.classList.add("score-pop");
        const image = document.createElement("img");
        image.src = `../assets/Beer_gif/success/ (${Math.floor(Math.random() * 22) + 1}).gif`;
        image.alt = "Bière ajoutée";
        gifContainer.replaceChildren(image);
        const beerRain = setInterval(spawnBeer, 500);
        setTimeout(() => {
          lastScore.textContent = "";
          gifContainer.replaceChildren();
          clearInterval(beerRain);
          beerRainContainer.replaceChildren();
        }, 10000);
      }

      async function loadInitialData() {
        pageMessage.textContent = "Chargement...";
        try {
          const [teams, beerList] = await Promise.all([fetchJSON("/api/teams"), fetchJSON("/api/beers")]);
          beers = beerList;
          teamsGrid.innerHTML = teams.map((team) =>
            `<button type="button" class="card" data-team-id="${team.id}">${escapeHtml(team.name)}</button>`
          ).join("");
          teamsGrid.querySelectorAll(".card").forEach((card) => card.addEventListener("click", () => selectTeam(card)));
          pageMessage.textContent = "";
        } catch (error) {
          console.error("Erreur de chargement :", error);
          pageMessage.textContent = `Impossible de charger les données : ${error.message}`;
        }
      }

      async function selectTeam(card) {
        if (depositActive) return;
        selectCard(teamsGrid, card);
        selectedTeamId = Number(card.dataset.teamId);
        selectedUserId = null;
        selectedType = null;
        selectedBeer = null;
        typesSection.hidden = true;
        brandsSection.hidden = true;
        usersSection.hidden = false;
        usersGrid.innerHTML = "<p>Chargement...</p>";
        try {
          let users;
          try {
            users = await fetchJSON("/api/users");
            users = users.filter((user) => Number(user.team_id) === selectedTeamId);
          } catch (_) {
            users = await fetchJSON(`/api/teams/${selectedTeamId}/users`);
          }
          usersGrid.innerHTML = users.map((user) =>
            `<button type="button" class="card" data-user-id="${user.id}">${escapeHtml(user.firstname)} ${escapeHtml(user.lastname)}</button>`
          ).join("");
          usersGrid.querySelectorAll(".card").forEach((userCard) =>
            userCard.addEventListener("click", () => selectUser(userCard))
          );
        } catch (error) {
          usersGrid.innerHTML = `<p>Impossible de charger les participants : ${escapeHtml(error.message)}</p>`;
        }
      }

      function selectUser(card) {
        selectCard(usersGrid, card);
        selectedUserId = Number(card.dataset.userId);
        selectedType = null;
        selectedBeer = null;
        brandsSection.hidden = true;
        const types = [...new Set(beers.map((beer) => beer.type).filter(Boolean))]
          .sort((a, b) => String(a).localeCompare(String(b), "fr"));
        typesGrid.innerHTML = types.map((type) =>
          `<button type="button" class="card" data-beer-type="${escapeHtml(type)}">${escapeHtml(type)}</button>`
        ).join("");
        typesGrid.querySelectorAll(".card").forEach((typeCard) =>
          typeCard.addEventListener("click", () => selectBeerType(typeCard))
        );
        typesSection.hidden = false;
      }

      function selectBeerType(card) {
        selectCard(typesGrid, card);
        selectedType = card.dataset.beerType;
        selectedBeer = null;
        const matchingBeers = beers.filter((beer) => beer.type === selectedType)
          .sort((a, b) => String(a.brand).localeCompare(String(b.brand), "fr"));
        brandsGrid.innerHTML = matchingBeers.map((beer) => `
          <button type="button" class="card" data-beer-id="${beer.id}">
            ${escapeHtml(beer.brand)}
            <span class="card-detail">${escapeHtml(beer.volume_ml)} ml · ${escapeHtml(beer.alcohol_degree)} %</span>
          </button>`).join("");
        brandsGrid.querySelectorAll(".card").forEach((brandCard) =>
          brandCard.addEventListener("click", () => selectBrand(brandCard))
        );
        brandsSection.hidden = false;
      }

      function selectBrand(card) {
        if (depositActive) return;
        selectCard(brandsGrid, card);
        selectedBeer = beers.find((beer) => Number(beer.id) === Number(card.dataset.beerId));
        if (selectedBeer) startDeposit();
      }

      async function startDeposit() {
        if (depositActive || !selectedUserId || !selectedBeer) return;
        depositActive = true;
        pageMessage.textContent = "";
        depositBeer.textContent = `${selectedBeer.type} - ${selectedBeer.brand}`;
        depositStatus.textContent = "Ouverture du moteur 1...";
        countdown.textContent = String(DEPOSIT_DURATION_SECONDS);
        popupClose.disabled = false;
        popupOverlay.style.display = "flex";
        try {
          await fetchJSON(KIOSK_SESSION_URL, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: selectedUserId }),
          });
          depositStatus.textContent = "Dépose ta bière dans le compartiment";
          let secondsRemaining = DEPOSIT_DURATION_SECONDS;
          countdownTimer = setInterval(() => {
            secondsRemaining -= 1;
            countdown.textContent = String(Math.max(secondsRemaining, 0));
          }, 1000);
          depositTimer = setTimeout(completeDeposit, DEPOSIT_DURATION_SECONDS * 1000);
        } catch (error) {
          console.error("Ouverture du moteur impossible :", error);
          popupOverlay.style.display = "none";
          depositActive = false;
          flash("flash-failure");
          pageMessage.textContent = `Impossible d'ouvrir le compartiment : ${error.message}`;
        }
      }

      async function completeDeposit() {
        clearDepositTimers();
        popupClose.disabled = true;
        countdown.textContent = "0";
        depositStatus.textContent = "Fermeture du moteur 1...";
        try {
          await fetchJSON(`${KIOSK_SESSION_URL}?motorAction=complete`, { method: "DELETE" });
          depositStatus.textContent = "Enregistrement de la bière...";
          const result = await fetchJSON(CONSUME_SELECTED_URL, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userId: selectedUserId, beerId: selectedBeer.id }),
          });
          popupOverlay.style.display = "none";
          depositActive = false;
          resetSelection();
          showSuccess(result.score);
          pageMessage.textContent = "Bière ajoutée !";
        } catch (error) {
          console.error("Fin du dépôt impossible :", error);
          popupOverlay.style.display = "none";
          depositActive = false;
          popupClose.disabled = false;
          flash("flash-failure");
          pageMessage.textContent = `La bière n'a pas pu être enregistrée : ${error.message}`;
        }
      }

      async function cancelDeposit() {
        if (!depositActive) return;
        clearDepositTimers();
        popupClose.disabled = true;
        depositStatus.textContent = "Fermeture du moteur 1...";
        try {
          await fetchJSON(`${KIOSK_SESSION_URL}?motorAction=cancel`, { method: "DELETE" });
        } catch (error) {
          console.error("Fermeture du moteur impossible :", error);
        } finally {
          popupOverlay.style.display = "none";
          popupClose.disabled = false;
          depositActive = false;
          resetSelection();
          pageMessage.textContent = "Dépôt annulé";
        }
      }

      popupClose.addEventListener("click", cancelDeposit);
      loadInitialData();
    </script>
  </body>
</html>
